# Startup – backend stack (API + world worker + PostgreSQL + nightly backups).
# Runs independently of other services on the VPS: own network, own volumes,
# API bound to 127.0.0.1 only (put a reverse proxy with TLS in front).
#
#   cp infra/docker/.env.example infra/docker/.env   # fill in secrets
#   docker compose -f infra/docker/docker-compose.yml --env-file infra/docker/.env up -d --build
name: startup-${STARTUP_ENV:-preview}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: startup
      POSTGRES_USER: startup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U startup -d startup']
      interval: 10s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://startup:${POSTGRES_PASSWORD}@db:5432/startup
      PORT: 8080
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    ports:
      - '127.0.0.1:${API_PORT:-8090}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health || exit 1']
      interval: 15s
      retries: 5
    stop_grace_period: 20s
    networks: [internal]

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ['node', 'apps/worker/dist/main.js']
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://startup:${POSTGRES_PASSWORD}@db:5432/startup
      WORKER_CONCURRENCY: 2
    stop_grace_period: 30s
    networks: [internal]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
      - ../scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ['/bin/sh', '/backup-loop.sh']
    networks: [internal]

  # Optional: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./metrics_token:/etc/prometheus/metrics_token:ro
      - promdata:/prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9091}:9090'
    networks: [internal]

volumes:
  pgdata:
  backups:
  promdata:

networks:
  internal:
