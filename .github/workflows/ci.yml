# CI for the Startup monorepo. This file takes effect once startup-vn/ is the root of its own repository.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'preview = Cloudflare Pages preview deployment; production requires approval of the "production" environment'
        type: choice
        options: [none, preview, production]
        default: none

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: startup_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/startup_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: apps/web/dist }

  deploy-preview:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == 'preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: dist }
      # --branch preview creates a Preview deployment; it never replaces the production deployment.
      - run: npx wrangler@3.99.0 pages deploy dist --project-name "${{ vars.CF_PAGES_PROJECT }}" --branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == 'production'
    runs-on: ubuntu-latest
    environment: production # configure required reviewers on this environment
    steps:
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: dist }
      - run: npx wrangler@3.99.0 pages deploy dist --project-name "${{ vars.CF_PAGES_PROJECT }}" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
